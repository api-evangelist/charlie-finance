name: Charlie Finance
kind: company
description: Charlie (Charlie Finance Co.) was a Pasadena, California fintech company
  that operated a mobile banking app and debit-card program built specifically for
  Americans aged 62 and older. Founded in 2021 by Kevin Nazemi, the service offered
  Social Security deposits paid up to several days early, a FraudShield protection
  layer tuned to scams that target seniors, 3% high-yield savings, no monthly fees
  or minimums, a fee-free Allpoint ATM network of 55,000+ machines, custom photo debit
  cards, and seven-day-a-week human customer support. Charlie is a portfolio company
  of Uncork Capital and raised a $7.5M seed round followed by a $23M Series A. The
  company discontinued service and permanently closed its debit-card program on January
  22, 2026. Charlie is a consumer neobank and does not publish a public developer API,
  documentation portal, or machine-readable API specification.
